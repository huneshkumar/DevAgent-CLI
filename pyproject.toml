[project]
name = "devagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "huneshkumar", email = "huneshk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
devagent = "devagent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
